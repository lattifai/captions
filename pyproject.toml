[build-system]
requires = ['setuptools>=60,<80', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'lattifai-captions'
version = '0.4.16'
description = "Caption/subtitle processing library with multi-format support (SRT, VTT, ASS, TTML, TextGrid, NLE formats)"
keywords = ['captions', 'subtitles', 'srt', 'vtt', 'ass', 'ttml', 'textgrid', 'forced alignment']
readme = 'README.md'
license = {text = 'Apache-2.0'}
authors = [
  { name = 'LattifAI Technologies', email = 'tech@lattifai.com' },
]
maintainers = [
  { name = 'Lattice', email = 'tech@lattifai.com' },
]
requires-python = '>=3.10,<3.15'

classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Operating System :: OS Independent',
    'Topic :: Multimedia :: Sound/Audio',
    'Topic :: Multimedia :: Video',
    'Topic :: Text Processing',
]

dependencies = [
    "pysubs2>=1.8.1",
    "praatio>=6.2.2",
    "tgt>=1.5",
    "lingua-language-detector>=2.1.1",
]

[project.optional-dependencies]
splitting = [
    "wtpsplit>=2.2.1",
    "onnxruntime>=1.23.2; python_version < '3.11'",
    "onnxruntime>=1.26.0; python_version >= '3.11'",
    "huggingface_hub>=1.14.0",
    "modelscope>=1.36.3",
    # Chinese word segmentation — used by CaptionStandardizer to avoid
    # cutting Chinese multi-char words across cue boundaries. The
    # ``_refine_groups_for_cjk_word_safety`` helper imports it lazily and
    # falls back to a no-op when unavailable, so this is opt-in.
    "jieba>=0.42.1",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "wtpsplit>=2.2.1",
    "onnxruntime>=1.23.2; python_version < '3.11'",
    "onnxruntime>=1.26.0; python_version >= '3.11'",
    "huggingface_hub>=1.14.0",
    "modelscope>=1.36.3",
    "jieba>=0.42.1",
]

[project.urls]
Homepage = 'https://github.com/lattifai/captions'
Documentation = 'https://github.com/lattifai/captions/blob/main/README.md'
'Bug Tracker' = 'https://github.com/lattifai/captions/issues'

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "--durations=10"
testpaths = ["tests"]
