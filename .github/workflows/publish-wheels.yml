name: Publish Source Distribution

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build_and_publish:
    name: Build source distribution and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools build

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Verify source distribution
        run: |
          echo "� Source distribution created:"
          ls -lah dist/

          echo ""
          echo "� Distribution details:"
          for sdist in dist/*.tar.gz; do
            echo "  ✓ $(basename $sdist)"
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

      - name: Publication summary
        run: |
          echo "✅ Successfully published to PyPI"
          echo ""
          echo "📦 Published distribution:"
          for sdist in dist/*.tar.gz; do
            echo "  ✓ $(basename $sdist)"
          done
          echo ""
          echo "🏷️ Tag: ${{ github.ref_name }}"
